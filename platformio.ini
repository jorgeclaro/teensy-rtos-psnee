; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Optional debug tasks (need DEBUG true in main.cpp). Add the flags you want to
; build_flags of an environment below, for example: -DDEBUG_STATS -DDEBUG_BLINK
;   -DDEBUG_HEX_SUBQ  print every SUBQ packet as hex
;   -DDEBUG_STATS     print task state, priority, stack high-water mark every 10 s
;   -DDEBUG_STATE     print power / pu22mode / drive state every 100 ms
;   -DDEBUG_BLINK     blink the built-in LED once per two seconds

[env:teensy36]
platform = https://github.com/tsandmann/platform-teensy.git
board = teensy36
framework = arduino
lib_deps = https://github.com/tsandmann/freertos-teensy.git
build_flags = -Wformat=1 -DUSB_SERIAL -DTEENSY_OPT_SMALLEST_CODE_LTO
upload_protocol = teensy-cli
#upload_protocol = teensy-gui
monitor_speed = 115200

[env:teensy40]
platform = https://github.com/tsandmann/platform-teensy.git
board = teensy40
framework = arduino
lib_deps = https://github.com/tsandmann/freertos-teensy.git
build_flags = -Wformat=1 -DUSB_SERIAL -DTEENSY_OPT_FASTER_LTO
upload_flags = -v
upload_protocol = teensy-cli
#upload_protocol = teensy-gui
monitor_speed = 115200

[env:teensy41]
platform = https://github.com/tsandmann/platform-teensy.git
board = teensy41
framework = arduino
lib_deps = https://github.com/tsandmann/freertos-teensy.git
build_flags = -Wformat=1 -DUSB_SERIAL -DTEENSY_OPT_FASTER_LTO
upload_flags = -v
